# Netlify build settings for the SS Solutions Next.js site.
# Netlify detects Next.js and adds its Next.js runtime automatically
# (server pages, the /api/contact function and image optimisation).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
